name: WB Монитор цен

on:
  schedule:
    # Каждые 5 минут — это минимум, который принимает GitHub.
    # Репозиторий публичный, поэтому минуты Actions не расходуются.
    # GitHub все равно может задержать запуск на 10-15 минут: расписание тут
    # не гарантия, а пожелание. Нужен мгновенный ответ — Run workflow вручную.
    - cron: '*/5 * * * *'
  workflow_dispatch:        # кнопка «Run workflow» для ручного прогона

permissions:
  contents: write           # нужно, чтобы коммитить обновленную историю цен

concurrency:
  group: wb-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v5

      - name: Проверить цены
        shell: pwsh
        env:
          WB_TELEGRAM_TOKEN: ${{ secrets.WB_TELEGRAM_TOKEN }}
          WB_TELEGRAM_CHAT: ${{ secrets.WB_TELEGRAM_CHAT }}
        run: ./WBМонитор.ps1 -БезВсплывающихОкон

      - name: Сохранить историю
        run: |
          git config user.name  "wb-monitor"
          git config user.email "wb-monitor@users.noreply.github.com"
          git add История.csv ПоследняяПроверка.txt Товары.txt ОчередьТелеграм.txt

          if git diff --staged --quiet; then
            echo "Изменений нет"
            exit 0
          fi

          git commit -m "Проверка цен $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Пока прогон работал, в ветку мог попасть чужой коммит — соседний прогон
          # или правка с машины. Тогда push отклоняется. Подтягиваем и повторяем,
          # иначе результат проверки просто теряется.
          for Попытка in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push отклонен, подтягиваю изменения и повторяю (попытка $Попытка из 3)"
            git pull --rebase --autostash
          done

          echo "Не удалось сохранить историю после трех попыток"
          exit 1
